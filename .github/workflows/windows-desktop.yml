name: Windows desktop installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Tauri icons
        run: bunx tauri icon packages/frontend/public/icon-512.png --output src-tauri/icons

      - name: Compile backend sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
          bun build packages/backend/src/index.ts `
            --compile `
            --minify `
            --outfile "src-tauri/binaries/inkvoice-backend-x86_64-pc-windows-msvc.exe"

      - name: Check desktop Rust crate
        run: cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build Tauri installers
        run: bun run desktop:build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: inkvoice-windows-installers-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30
